<style>

@font-face{font-family:"Switzer";src:url(assets/fonts/Switzer-normal.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Cabinet Grotesk";src:url(assets/fonts/CabinetGrotesk-normal.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Tabular";src:url(assets/fonts/Tabular-normal.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:swap}

:root{
  --paper:#13140E;--paper-2:#1A1B14;--paper-3:#25261E;--night:#0D0E09;
  --ink:#F4F3E8;--ink-2:#C9C8BB;--ink-3:#A3A296;
  --line:rgba(244,243,232,.16);--line-2:rgba(244,243,232,.09);
  --lime:#EBFC72;--accent:#7EDB5A;--accent-2:#5CC8DC;--warn:#F2A65A;--bad:#F26B5B;
  --sA:#52A833;--sB:#2F95C9;
  --accent-soft:rgba(126,219,90,.14);
  --f-display:"Cabinet Grotesk","Switzer",ui-sans-serif,system-ui,sans-serif;
  --f-sans:"Switzer",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"Tabular",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;--ease:cubic-bezier(.16,1,.3,1);
  --wrap:min(1180px, calc(100vw - 32px));
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;font:400 17px/1.6 var(--f-sans);background:var(--paper);overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit}
.wrap{width:var(--wrap);margin-inline:auto}
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:24px;height:24px;flex:none;transition:transform .35s var(--ease)}
a:hover .ic{transform:translate(2px,-2px)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;line-height:1.05;margin:0}
h2{font-size:clamp(32px,4.6vw,56px);max-width:17ch}
h3{font-size:21px;font-weight:700;line-height:1.2;margin:0 0 8px}
p{margin:0 0 1em;max-width:66ch;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.lede{font-size:clamp(19px,1.8vw,22px);color:var(--ink);max-width:52ch}
strong,b{color:var(--ink);font-weight:600}

.top{position:sticky;top:0;z-index:20;background:rgba(19,20,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
.top .name{font-family:var(--f-display);font-weight:800;font-size:20px}
.top nav{display:flex;gap:24px;font-size:15px;color:var(--ink-2)}
.top nav a:hover{color:var(--ink)}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}

.hero{padding:72px 0 56px}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(46px,7.4vw,104px);margin:14px 0 22px}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin:32px 0 0;padding:24px 0 0;border-top:1px solid var(--line)}
.meta dt{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.meta dd{margin:0;color:var(--ink);font-size:15px;line-height:1.45}

/* cluster illustration */
.cluster{position:relative;aspect-ratio:16/10;border-radius:22px;background:radial-gradient(120% 90% at 50% 0%,#20221a 0%,var(--night) 70%);border:1px solid var(--line);overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.8)}
.cluster svg.road{position:absolute;inset:0;width:100%;height:100%}
.cl-sign{position:absolute;left:7%;top:12%;width:17%;aspect-ratio:1;border-radius:50%;background:#fff;border:solid #D62E2E;border-width:clamp(5px,1.1vw,10px);display:grid;place-items:center;color:#111;font:800 clamp(18px,3vw,36px)/1 var(--f-display)}
.cl-sign.pulse{animation:pulse 1.2s var(--ease)}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
.cl-hint{position:absolute;left:26%;top:15%;max-width:44%;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(244,243,232,.08);border:1px solid var(--line);font:500 clamp(10px,1.15vw,13px)/1.2 var(--f-mono);color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.cl-hint.on{opacity:1;transform:none}
.cl-hint b{color:var(--accent);font-weight:500}
.cl-hint .ring{width:18px;height:18px;flex:none}
.cl-set{position:absolute;right:7%;top:12%;text-align:right}
.cl-set .lbl{font:500 clamp(10px,1.1vw,12px)/1 var(--f-mono);letter-spacing:.08em;color:var(--ink-3)}
.cl-set .val{display:flex;align-items:center;gap:10px;justify-content:flex-end;font:800 clamp(26px,4.4vw,52px)/1 var(--f-display);color:var(--accent);margin-top:6px;transition:color .4s}
.cl-set .val.cancel{color:var(--ink)}
.cl-set .val.cancel #set{text-decoration:line-through;text-decoration-thickness:3px}
.cl-set .unit{font:500 clamp(10px,1.1vw,12px)/1 var(--f-mono);color:var(--ink-3)}
.tt{width:clamp(14px,1.8vw,22px);height:auto;aspect-ratio:1/2;color:#fff;transition:color .5s var(--ease)}
.tt.match{color:var(--accent)}
.cl-speed{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);text-align:center}
.cl-speed .v{font:800 clamp(30px,5.4vw,64px)/1 var(--f-display)}
.cl-speed .u{font:500 12px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.08em}
.cl-pop{position:absolute;left:50%;top:55%;transform:translate(-50%,-40%) scale(.96);width:min(70%,420px);display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:14px;background:#2a2b24;border:1px solid var(--line);text-align:left;opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.cl-pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cl-pop .ps{flex:none;width:clamp(30px,4.4vw,48px);aspect-ratio:1;border-radius:50%;background:#fff;border:clamp(3px,.6vw,5px) solid #D62E2E;color:#111;display:grid;place-items:center;font:800 clamp(11px,1.6vw,17px)/1 var(--f-display)}
.cl-pop .t{font:600 clamp(11px,1.4vw,15px)/1.3 var(--f-sans)}
.cl-tag{position:absolute;left:14px;bottom:12px;font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink-3)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
button{font:500 14px/1 var(--f-sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer;transition:background .25s,border-color .25s,color .25s}
button:hover{border-color:var(--ink-3)}
button:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.seg button{border:0;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button.primary{background:var(--accent);color:#0f1a0a;border-color:var(--accent);font-weight:600}
.demo-note{font-size:14px;color:var(--ink-3);margin-top:10px}

/* sections */
section{padding:104px 0;border-top:1px solid var(--line-2)}
.sec-head{display:grid;grid-template-columns:220px 1fr;gap:32px;margin-bottom:44px}
.sec-head .mono{padding-top:10px}
.sec-head h2+p{margin-top:20px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.cols-4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.card{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);padding:24px}
.card p{font-size:15px;margin:0}
.card .mono{display:block;margin-bottom:10px}
.k{font:800 clamp(40px,5vw,60px)/1 var(--f-display);color:var(--ink)}
.k small{font-size:.42em;color:var(--ink-3);margin-left:4px;font-weight:700}
.stat .k{margin-bottom:10px}
.stat p{font-size:14px}
.pull{font:700 clamp(24px,3vw,36px)/1.2 var(--f-display);color:var(--ink);max-width:28ch;margin:44px 0 0;padding-left:20px;border-left:3px solid var(--accent)}
.quote{font:600 clamp(19px,2vw,24px)/1.35 var(--f-display);color:var(--ink)}
.quote cite{display:block;margin-top:10px;font:500 13px/1 var(--f-mono);font-style:normal;color:var(--ink-3);letter-spacing:.06em}

.rail{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px;padding-top:28px}
.rail::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line)}
.rail .fill{position:absolute;left:0;top:9px;height:2px;width:100%;background:var(--accent);transform-origin:0 50%}
.step{position:relative}
.step::before{content:"";position:absolute;top:-25px;left:0;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.step .mono{display:block;margin-bottom:6px}
.step h3{font-size:17px}
.step p{font-size:14px;margin:6px 0 0}

.onepager{background:#f4f3e8;color:#222;border-radius:4px;padding:28px;font-size:14px;line-height:1.5;transform:rotate(-1.2deg);box-shadow:0 30px 60px -30px rgba(0,0,0,.7);max-width:440px}
.onepager .h{font:800 18px/1.2 var(--f-display);margin-bottom:10px}
.onepager .bar{height:9px;border-radius:2px;background:#d9d7c8;margin:8px 0}
.onepager .gap{border:1px dashed #b14a3a;color:#b14a3a;padding:8px 10px;border-radius:3px;margin-top:14px;font:500 12px/1.4 var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font:500 13px/1 var(--f-mono);padding:9px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2)}

/* scenario sim */
.sim{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);padding:20px}
.sim-road{position:relative;height:150px;border-radius:10px;background:var(--night);overflow:hidden}
.sim-road .lane{position:absolute;left:0;right:0;height:2px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 26px,transparent 26px 52px);opacity:.45}
.veh{position:absolute;width:46px;height:22px;border-radius:6px}
.veh.me{left:16%;top:84px;background:var(--accent)}
.veh.o{background:#5d5f53;animation:flow 3.4s linear infinite}
@keyframes flow{from{transform:translateX(0)}to{transform:translateX(-140%)}}
.sim-sign{position:absolute;top:12px;left:110%;width:46px;height:46px;border-radius:50%;background:#fff;border:6px solid #D62E2E;display:grid;place-items:center;font:800 16px/1 var(--f-display);color:#111}
.sim-sign small{position:absolute;top:50px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 11px/1 var(--f-mono);color:var(--ink-3)}
.sim-out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.sim-out .card{padding:16px}
.sim-out .big{font:800 34px/1 var(--f-display);margin:4px 0 8px}
.ok{color:var(--accent)}.no{color:var(--bad)}

/* journey */
.journey{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);padding:24px;overflow-x:auto}
.journey svg{min-width:720px;width:100%;height:auto}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:8px;vertical-align:middle}
.legend i.sq{width:12px;height:12px;border-radius:3px}

.brand{font:800 26px/1 var(--f-display);display:block;margin-bottom:10px}
.verdict{display:inline-block;font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;margin-bottom:12px}
.v-min{background:rgba(242,107,91,.14);color:var(--bad)}
.v-gra{background:var(--accent-soft);color:var(--accent)}
.meter{height:14px;border-radius:999px;background:var(--paper-3);overflow:hidden;margin:14px 0 8px}
.meter span{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--warn),var(--bad));border-radius:999px;transform-origin:0 50%}

/* concepts */
.concept{display:flex;flex-direction:column;gap:14px}
.mini-cl{position:relative;height:120px;border-radius:10px;background:var(--night);border:1px solid var(--line-2);overflow:hidden}
.mini-cl .s{position:absolute;left:14px;top:16px;width:52px;height:52px;border-radius:50%;background:#fff;border:5px solid #D62E2E;display:grid;place-items:center;font:800 18px/1 var(--f-display);color:#111}
.mini-cl .tri{position:absolute;left:34px;top:76px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-bottom:11px solid var(--accent)}
.mini-cl .v{position:absolute;right:16px;top:20px;font:800 30px/1 var(--f-display);color:var(--accent);display:flex;align-items:center;gap:6px}
.mini-cl .v svg{width:11px;height:22px;color:var(--accent)}
.mini-cl .v.w svg{color:#fff}
.mini-cl .v.x{color:var(--ink)}
.mini-cl .v.x span{text-decoration:line-through}
.mini-cl .p{position:absolute;left:80px;right:16px;top:74px;padding:7px 10px;border-radius:8px;background:#2a2b24;font:600 12px/1.25 var(--f-sans)}
.list{margin:0;padding-left:20px}
.list li{margin-bottom:8px;color:var(--ink-2);font-size:15px}

/* chart */
.chart{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);padding:24px}
.bars{display:grid;gap:20px;margin-top:18px}
.bar-row{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:16px;align-items:center}
.bar-row .lab{font-size:15px;color:var(--ink)}
.bar-pair{display:grid;gap:4px}
.bar{position:relative;height:16px}
.bar span{position:absolute;left:0;top:0;bottom:0;width:calc(var(--v) / 7 * 100%);border-radius:0 4px 4px 0;transform-origin:0 50%}
.bar.a span{background:var(--sA)}.bar.b span{background:var(--sB)}
.bar em{position:absolute;top:50%;transform:translateY(-50%);left:calc(var(--v) / 7 * 100% + 8px);font:500 13px/1 var(--f-mono);font-style:normal;color:var(--ink-2)}
.bar[data-tip]:hover::after{content:attr(data-tip);position:absolute;left:calc(var(--v) / 7 * 100% + 56px);top:50%;transform:translateY(-50%);white-space:nowrap;background:var(--paper-3);border:1px solid var(--line);padding:6px 8px;border-radius:6px;font-size:12px;color:var(--ink)}
.axis{display:grid;grid-template-columns:minmax(150px,240px) 1fr;gap:16px;margin-top:6px}
.axis div{display:flex;justify-content:space-between;font:500 11px/1 var(--f-mono);color:var(--ink-3);border-top:1px solid var(--line-2);padding-top:6px}
.fine{font-size:13px;color:var(--ink-3);margin-top:14px}

/* change table */
.chg{display:grid;gap:0}
.chg-row{display:grid;grid-template-columns:1fr 40px 1fr;gap:16px;align-items:center;padding:20px 0;border-bottom:1px solid var(--line-2)}
.chg-row p{margin:0;font-size:15px}
.chg-row .arrow{color:var(--accent);font:500 20px/1 var(--f-mono);text-align:center}
.chg-row .to{color:var(--ink)}
.chg-head{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding-bottom:10px;border-bottom:1px solid var(--line)}

/* flow */
.flow{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);padding:20px;overflow-x:auto}
.flow svg{min-width:760px;width:100%;height:auto}
.flow .node rect{fill:var(--night);stroke:rgba(244,243,232,.18)}
.flow .node.on rect{stroke:var(--accent)}
.flow text{font-family:Switzer,sans-serif;fill:#F4F3E8}
.flow .edge{fill:none;stroke:rgba(244,243,232,.35);stroke-width:1.5}
.flow .elab{font:500 11px Tabular,monospace;fill:#A3A296;letter-spacing:.04em}
.flow [data-mode-only]{transition:opacity .4s}

/* regulation */
.reg-row{display:grid;grid-template-columns:120px 1fr 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line-2);align-items:start}
.reg-row .mono{color:var(--accent-2)}
.reg-row p{margin:0;font-size:15px}

/* next */
.next-grid .card{min-height:100%}
.tag{display:inline-block;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;padding:6px 9px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);margin-bottom:14px}
.tag.live{color:var(--accent);border-color:rgba(126,219,90,.4)}

.next{padding:80px 0 120px}
.next a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.next a span{font:800 clamp(28px,4vw,48px)/1 var(--f-display)}
footer{padding:32px 0 48px;color:var(--ink-3);font-size:14px}

@media (max-width:980px){
  .hero-grid,.sec-head,.cols,.cols-2,.cols-4{grid-template-columns:1fr}
  .rail{grid-template-columns:1fr;padding-top:0;padding-left:28px}
  .rail::before{left:5px;right:auto;top:0;bottom:0;width:2px;height:auto}
  .rail .fill{left:5px;top:0;width:2px;height:100%;transform-origin:50% 0}
  .step::before{top:4px;left:-28px}
  .reg-row{grid-template-columns:1fr;gap:6px}
  .chg-row{grid-template-columns:1fr;gap:6px}
  .chg-row .arrow{text-align:left;transform:rotate(90deg);width:20px}
  .chg-head{display:none}
  .bar-row,.axis{grid-template-columns:1fr}
  .axis>span{display:none}
  section{padding:76px 0}
  .top nav a:not(:last-child){display:none}
}
@media (min-width:981px) and (max-width:1180px){.cols-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- V7 additions ---------- */
.chain{display:flex;flex-wrap:wrap;gap:6px 4px;align-items:center}
.chain span{font-size:14px;color:var(--ink)}
.chain i{font-style:normal;color:var(--accent);font:500 12px/1 var(--f-mono);padding:0 2px}

/* cluster, laid out like the released logic slides */
.cl-sign{left:7%;top:14%;width:21%;transition:opacity .3s var(--ease)}
.cluster.popping .cl-sign{opacity:0}
.cl-main{position:absolute;right:8%;top:10%;text-align:right}
.cl-main .v{font:800 clamp(56px,10vw,128px)/.9 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.cl-main .kmh{font:500 clamp(10px,1.1vw,12px)/1 var(--f-mono);letter-spacing:.08em;color:var(--ink-3);margin-top:4px}
.cl-setrow{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:14px;font:800 clamp(22px,3.4vw,40px)/1 var(--f-display);color:var(--ink);transition:color .35s}
.cl-setrow .u{font:500 clamp(10px,1.1vw,13px)/1 var(--f-mono);color:var(--ink-3);letter-spacing:.06em;align-self:flex-end;margin-bottom:4px}
.cl-setrow.on{color:var(--accent)}
.cl-setrow.x #set{text-decoration:line-through;text-decoration-thickness:3px}
.tt{width:clamp(13px,1.6vw,20px);height:auto;aspect-ratio:1/2;color:#fff;transition:color .5s var(--ease)}
.tt.match{color:var(--accent)}
.cl-pop{left:5%;top:11%;transform:translateY(-6px) scale(.97);width:min(50%,340px);transform-origin:0 50%}
.cl-pop.on{transform:none}
.cl-hint{left:31%;top:22%;max-width:34%}
.cl-cap{position:absolute;left:5%;bottom:8%;max-width:62%;font:500 clamp(11px,1.2vw,13px)/1.35 var(--f-mono);color:var(--ink-2);opacity:0;transform:translateY(6px);transition:opacity .35s var(--ease),transform .35s var(--ease)}
.cl-cap.on{opacity:1;transform:none}
.cl-cap b{color:var(--lime);font-weight:500}
.cl-mode{position:absolute;right:8%;bottom:8%;font:500 11px/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
.cluster .road{opacity:.7}
.pad{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
.pad button{padding:0 8px;font-family:var(--f-mono);font-size:13px;letter-spacing:.04em}
.guide{display:flex;gap:10px;align-items:flex-start;margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--paper-2);border:1px solid var(--line-2);font-size:14px;color:var(--ink-2);min-height:48px}
.guide b{color:var(--lime);font-weight:500;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;flex:none;padding-top:2px}
.tool-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.link-btn{border:0;padding:0 4px;min-height:44px;text-decoration:underline;text-underline-offset:3px;color:var(--ink-2)}

/* process rail: two rows of four */
.rail{grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 20px;padding-top:0}
.rail::before,.rail .fill{display:none}
.step{padding-top:24px;border-top:2px solid var(--line)}
.step::before{top:-7px;left:0}
.step::after{content:"";position:absolute;left:0;top:-2px;height:2px;width:100%;background:var(--accent);transform:scaleX(var(--p,0));transform-origin:0 50%;transition:transform 1.1s var(--ease)}
.step.lit{--p:1}

/* guerrilla dots */
.dots{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;max-width:420px}
.dots i{aspect-ratio:1;border-radius:50%;border:1.5px solid var(--line);background:transparent;transition:background .3s,border-color .3s}
.dots i.on{background:var(--accent);border-color:var(--accent)}
.big-n{font:800 clamp(64px,9vw,120px)/.9 var(--f-display);color:var(--ink)}

/* text fix */
.swap{display:grid;grid-template-columns:1fr 48px 1fr;gap:16px;align-items:center}
.swap .pill{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:14px;background:#2a2b24;border:1px solid var(--line)}
.swap .pill .ps{flex:none;width:44px;height:44px;border-radius:50%;background:#fff;border:5px solid #D62E2E;color:#111;display:grid;place-items:center;font:800 16px/1 var(--f-display)}
.swap .pill p{margin:0;color:var(--ink);font:600 16px/1.35 var(--f-sans)}
.swap .old .w{position:relative;color:var(--bad)}
.swap .old .w::after{content:"";position:absolute;left:-2px;right:-2px;top:55%;height:2px;background:var(--bad);transform:scaleX(var(--s,1));transform-origin:0 50%;transition:transform .8s var(--ease) .3s}
.swap .new .w{color:var(--accent)}
.swap .arrow{color:var(--accent);font:500 22px/1 var(--f-mono);text-align:center}
.swap .lab{display:block;margin-bottom:10px}
.vq{border-left:3px solid var(--sA);padding-left:16px}
.vq.b{border-color:var(--sB)}

@media (max-width:980px){
  .rail{grid-template-columns:1fr 1fr;gap:32px 16px}
  .swap{grid-template-columns:1fr}
  .swap .arrow{transform:rotate(90deg);width:22px}
  .pad{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:560px){.rail{grid-template-columns:1fr}}

.glass{position:relative;z-index:3;width:min(440px,100%);padding:36px 32px 28px;border-radius:28px;text-align:center;
  background:linear-gradient(160deg,rgba(244,243,232,.14),rgba(244,243,232,.04) 55%,rgba(244,243,232,.07));
  border:1px solid rgba(244,243,232,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 40px 90px -30px rgba(0,0,0,.8);
  backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.12),transparent 70%)}

.glass-kicker{margin:0 auto 6px;font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.glass-title{font:800 clamp(28px,6vw,36px)/1.05 var(--f-display);margin:0 0 12px}
.glass-text{margin:0 auto 22px;font-size:15px;color:var(--ink-2);max-width:34ch}
.glass-field{position:relative;display:flex;align-items:center;border-radius:14px;background:rgba(13,14,9,.45);border:1px solid rgba(244,243,232,.16);transition:border-color .3s,box-shadow .3s}

.glass-err{min-height:20px;margin:10px 0 6px;font-size:14px;color:var(--bad);text-align:left}
.glass-go{width:100%;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;border:0;background:var(--lime);color:#14160c;font:600 16px/1 var(--f-sans);box-shadow:0 10px 30px -10px rgba(235,252,114,.5);transition:transform .3s var(--ease),box-shadow .3s}

<script>
window.initCase=function(){
  const $=id=>document.getElementById(id);
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---------- cluster demo: follows the released engagement and disengagement logic ---------- */
  const cl=$('cluster'),sign=$('sign'),spd=$('spd'),setEl=$('set'),setRow=$('setRow'),tt=$('tt'),pop=$('pop'),popT=$('popT'),popSign=$('popSign'),
        hint=$('hint'),hintText=$('hintText'),arc=$('ringArc'),cap=$('cap'),guide=$('guide'),clMode=$('clMode');
  const SIGNS=[90,50,70,100,80,70];
  let S, rampT=null, cueT=null, capT=null, playT=[], signI=0;
  function fresh(){ S={state:'ready',mode:S?S.mode:'manual',variant:S?S.variant:'popup',limit:70,speed:80,set:null,prev:null,recall:false,cue:null}; signI=0; }
  fresh();

  function render(){
    sign.textContent=S.limit; spd.textContent=S.speed;
    setEl.textContent=S.state==='ready'?'--':S.set;
    setRow.classList.toggle('on',S.state==='engaged');
    setRow.classList.toggle('x',S.state==='cancelled');
    tt.classList.toggle('match',S.state==='engaged'&&S.set===S.limit);
    clMode.textContent=S.mode==='manual'?'Manually confirmed':'Automatic';
    tips();
  }
  function tips(){
    let t;
    if(S.state==='ready') t='Press SET + or SET − to start cruising at your current speed.';
    else if(S.state==='cancelled') t='Press RES to resume '+S.set+', or SET to cruise at your current speed.';
    else if(S.cue==='accept') t='Press RES to accept '+S.limit+'. Do nothing and the car stays at '+S.set+'.';
    else if(S.cue==='resume') t='Press RES within five seconds to go back to '+S.prev+'.';
    else if(S.set!==S.limit) t=(S.mode==='manual'?'Press RES to accept the limit of ':'Press RES to follow the limit of ')+S.limit+', or pass a new sign.';
    else t='You are at the limit. Pass a new sign, change your speed with SET, or press CANC.';
    guide.textContent=t;
  }
  function ramp(){ clearInterval(rampT); if(S.state!=='engaged') return;
    rampT=setInterval(()=>{ if(S.speed===S.set){clearInterval(rampT);return} S.speed+=S.speed<S.set?1:-1; spd.textContent=S.speed; },45); }
  function say(html){ cap.innerHTML=html; cap.classList.remove('on'); void cap.offsetWidth; cap.classList.add('on'); clearTimeout(capT); capT=setTimeout(()=>cap.classList.remove('on'),4200); }
  function hideCue(){ pop.classList.remove('on'); hint.classList.remove('on'); cl.classList.remove('popping'); clearTimeout(cueT); arc.style.transition='none'; arc.style.strokeDashoffset=0; S.cue=null; }
  function showCue(kind){
    hideCue(); S.cue=kind;
    const text=kind==='accept'?'Speed zone detected. To accept, press RES':'Speed zone detected. To resume previous set speed, press RES';
    if(S.variant==='popup'){ popSign.textContent=S.limit; popT.textContent=text; pop.classList.add('on'); cl.classList.add('popping'); }
    else{ hintText.innerHTML=kind==='accept'?'<b>RES</b> to accept':'<b>RES</b> for '+S.prev; hint.classList.add('on');
      arc.getBoundingClientRect(); arc.style.transition='stroke-dashoffset 5s linear'; arc.style.strokeDashoffset=50.3; }
    cueT=setTimeout(()=>{ const k=S.cue; hideCue();
      if(k==='accept') say('No press. Staying at <b>'+S.set+'</b>.');
      if(k==='resume'){ S.recall=false; say('Window closed. Staying at <b>'+S.set+'</b>.'); }
      tips(); },5000);
  }
  const A={
    set(d){
      if(S.state!=='engaged'){ S.state='engaged'; S.set=Math.round(S.speed/5)*5; S.recall=false; hideCue();
        say('SET: cruising at <b>'+S.set+'</b>.');
        if(S.mode==='manual'&&S.set!==S.limit) showCue('accept');
      } else { hideCue(); S.recall=false; S.set=Math.max(30,Math.min(130,S.set+d*5)); say('SET '+(d>0?'+':'−')+': own speed <b>'+S.set+'</b>.'); }
      render(); ramp();
    },
    res(){
      if(S.state==='ready'){ S.state='engaged'; S.set=S.limit; hideCue(); say('RES: following the limit, <b>'+S.limit+'</b>.'); }
      else if(S.state==='cancelled'){ S.state='engaged'; hideCue(); say('RES: resumed <b>'+S.set+'</b>.'); }
      else if(S.cue==='resume'||(S.mode==='auto'&&S.recall)){ S.set=S.prev; S.recall=false; hideCue(); say('RES: back to <b>'+S.set+'</b>.'); }
      else if(S.set!==S.limit){ S.set=S.limit; hideCue(); say((S.mode==='manual'?'RES: accepted ':'RES: following ')+'<b>'+S.limit+'</b>.'); }
      else { say('Already at the limit.'); }
      render(); ramp();
    },
    canc(){
      if(S.state!=='engaged'){ say('Nothing to cancel.'); return; }
      S.state='cancelled'; S.recall=false; hideCue(); clearInterval(rampT); say('CANC: cruise cancelled. The set speed waits for RES.'); render();
    },
    sign(L){
      if(L==null){ do{ L=SIGNS[signI++%SIGNS.length]; }while(L===S.limit); }
      S.limit=L; sign.classList.remove('pulse'); void sign.offsetWidth; sign.classList.add('pulse');
      if(S.state==='engaged'){
        if(S.set===L){ hideCue(); say('New limit <b>'+L+'</b> matches your set speed. No message.'); }
        else if(S.mode==='manual'){ showCue('accept'); say('New sign: <b>'+L+'</b>. Waiting for the driver.'); }
        else { S.prev=S.set; S.set=L; S.recall=true; showCue('resume'); say('New sign: adopted <b>'+L+'</b>.'); }
      } else if(S.state==='cancelled'&&S.mode==='auto'){ S.set=L; say('Cancelled set speed updated to <b>'+L+'</b>.'); }
      else say('New sign: <b>'+L+'</b>.');
      render(); ramp();
    }
  };
  function stopPlay(){ playT.forEach(clearTimeout); playT=[]; }
  function reset(){ stopPlay(); hideCue(); clearInterval(rampT); fresh(); cap.classList.remove('on'); render(); }
  function play(){
    reset();
    const m=[[()=>say('Cruise is ready. Limit <b>70</b>, driving 80.'),1800],[()=>A.set(1),3000],[()=>A.res(),3000],[()=>A.sign(90),2800],[()=>A.res(),3000],[()=>A.sign(50),6400],[()=>A.canc(),2600],[()=>A.res(),2600]];
    const a=[[()=>say('Cruise is ready. Limit <b>70</b>, driving 80.'),1800],[()=>A.set(1),2600],[()=>A.res(),3000],[()=>A.sign(90),2800],[()=>A.res(),3000],[()=>A.sign(50),6400],[()=>A.canc(),2600],[()=>A.res(),2600]];
    let t=200; (S.mode==='manual'?m:a).forEach(([fn,d])=>{ playT.push(setTimeout(fn,t)); t+=d; });
  }
  document.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{ stopPlay();
    const k=b.dataset.act; if(k==='setp')A.set(1); else if(k==='setm')A.set(-1); else if(k==='res')A.res(); else if(k==='canc')A.canc(); else A.sign(); }));
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{ S.mode=b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b)); reset(); say(S.mode==='manual'?'Manually confirmed: each new limit is a proposal.':'Automatic: new limits apply, RES goes back.'); }));
  document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>{ S.variant=b.dataset.variant;
    document.querySelectorAll('[data-variant]').forEach(x=>x.setAttribute('aria-pressed',x===b)); const k=S.cue; if(k) showCue(k); }));
  $('play').addEventListener('click',play);
  $('reset').addEventListener('click',reset);
  render();
  if(!reduce){ let started=false;
    const io=new IntersectionObserver(es=>{ if(es[0].isIntersecting&&!started){ started=true; setTimeout(play,700); io.disconnect(); } },{threshold:.5});
    io.observe(cl); }

  /* ---------- flow toggle ---------- */
  const flowNotes={manual:'Manually confirmed: a new limit is only a proposal. RES accepts it, even after the message times out. Do nothing and the car keeps your speed.',
    auto:'Automatic: a new limit is adopted straight away. For five seconds, RES takes the driver back to the previous set speed. SET + or − sets your own speed at any time.'};
  document.querySelectorAll('[data-flow]').forEach(b=>b.addEventListener('click',()=>{const m=b.dataset.flow;
    document.querySelectorAll('[data-flow]').forEach(x=>x.setAttribute('aria-pressed',x===b));
    document.querySelectorAll('[data-mode-only]').forEach(g=>g.style.opacity=g.dataset.modeOnly===m?1:0);
    $('flowNote').textContent=flowNotes[m];}));

  /* ---------- scenario sim ---------- */
  const simSign=$('simSign'),simAuto=$('simAuto'),simMan=$('simMan');
  $('simPlay').addEventListener('click',()=>{
    simAuto.textContent='70';simMan.textContent='70';
    simSign.style.transition='none';simSign.style.left='110%';simSign.getBoundingClientRect();
    simSign.style.transition='left 2.4s linear';simSign.style.left='-20%';
    let v=70; setTimeout(()=>{ const t=setInterval(()=>{ v--; simAuto.textContent=v; if(v<=55) clearInterval(t); },60); },1700);
  });

  /* ---------- guerrilla dots ---------- */
  const dots=$('dots'); for(let i=0;i<60;i++){ const d=document.createElement('i'); if(reduce) d.className='on'; dots.appendChild(d); }

  /* ---------- motion ---------- */
  if(!window.gsap||reduce){ document.querySelectorAll('.step').forEach(s=>s.classList.add('lit')); return; }
  gsap.registerPlugin(ScrollTrigger);
  gsap.to('.progress',{scaleX:1,ease:'none',scrollTrigger:{start:0,end:'max',scrub:.3}});
  gsap.utils.toArray('[data-split]').forEach(el=>gsap.from(el,{yPercent:30,opacity:0,duration:1,ease:'expo.out',scrollTrigger:{trigger:el,start:'top 88%'}}));
  gsap.utils.toArray('[data-r]').forEach(el=>gsap.from(el,{y:28,opacity:0,duration:.9,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 92%'}}));
  gsap.utils.toArray('.step').forEach((s,i)=>ScrollTrigger.create({trigger:s,start:'top 85%',once:true,onEnter:()=>setTimeout(()=>s.classList.add('lit'),(i%4)*140)}));
  document.querySelectorAll('path.draw').forEach(p=>{const L=p.getTotalLength();p.style.strokeDasharray=L;
    gsap.fromTo(p,{strokeDashoffset:L},{strokeDashoffset:0,duration:2,ease:'power2.inOut',scrollTrigger:{trigger:p.closest('.journey'),start:'top 70%'}});});
  gsap.from('.meter span',{scaleX:0,duration:1.6,ease:'expo.out',scrollTrigger:{trigger:'.meter',start:'top 85%'}});
  gsap.from('.bar span',{scaleX:0,duration:1.2,ease:'expo.out',stagger:.06,scrollTrigger:{trigger:'.bars',start:'top 80%'}});
  document.querySelectorAll('[data-count]').forEach(el=>{ const n=+el.dataset.count,o={v:0};
    gsap.to(o,{v:n,duration:1.4,ease:'power2.out',scrollTrigger:{trigger:el,start:'top 90%'},onUpdate:()=>el.textContent=Math.round(o.v)}); });
  ScrollTrigger.create({trigger:'#dots',start:'top 80%',once:true,onEnter:()=>{ [...dots.children].forEach((d,i)=>setTimeout(()=>d.classList.add('on'),i*22)); }});
  const strike=document.querySelector('.swap .old .w'); strike.style.setProperty('--s',0);
  ScrollTrigger.create({trigger:'#swap',start:'top 75%',once:true,onEnter:()=>strike.style.setProperty('--s',1)});
  gsap.from('.swap .new .pill',{x:-20,opacity:0,duration:1,delay:.8,ease:'power3.out',scrollTrigger:{trigger:'#swap',start:'top 75%'}});
  ScrollTrigger.create({trigger:'#scenario .sim',start:'top 70%',once:true,onEnter:()=>$('simPlay').click()});
};
</script>

  document.body.classList.add('locked');

  /* ---- topographic contours that drift ---- */
  var svg=document.getElementById('terrain'), lines=[], N=26, t0=performance.now();
  function size(){ svg.setAttribute('viewBox','0 0 '+innerWidth+' '+innerHeight); }
  size(); addEventListener('resize',size);
  for(var i=0;i<N;i++){ var p=document.createElementNS('http://www.w3.org/2000/svg','path'); if(i%5===0)p.setAttribute('class','major'); svg.appendChild(p); lines.push(p); }
  var speed=1;
  function draw(now){
    var w=innerWidth,h=innerHeight,t=(now-t0)/1000*speed, seg=48;
    for(var i=0;i<N;i++){
      var base=h*(i+.5)/N, d='';
      for(var k=0;k<=seg;k++){
        var x=w*k/seg, u=k/seg;
        var y=base+Math.sin(u*6.2+i*.55+t*.12)*h*.035+Math.sin(u*13.1-i*.31+t*.07)*h*.014+Math.cos(u*2.3+i*.9)*h*.05*Math.sin(i*.4+t*.05);
        d+=(k?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
      }
      lines[i].setAttribute('d',d);
    }
    if(!reduce && gate.isConnected) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---- headlamp follows the pointer, HUD heading follows too ---- */
  var lamp=document.getElementById('lamp'), hdg=document.getElementById('hdg'), elev=document.getElementById('elev');
  var lx=innerWidth/2, ly=innerHeight*.45, tx=lx, ty=ly;
  addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;});
  (function follow(){ lx+=(tx-lx)*.08; ly+=(ty-ly)*.08; lamp.style.transform='translate('+lx+'px,'+ly+'px)';
    hdg.textContent=String(Math.round((tx/innerWidth)*359)).padStart(3,'0');
    elev.textContent=(2200+Math.round((1-ty/innerHeight)*420)).toLocaleString('en-CA');
    if(gate.isConnected) requestAnimationFrame(follow); })();

  /* ---- entrance ---- */
  function intro(){ if(!G()||reduce) return;
    G().from(form,{y:40,opacity:0,scale:.96,filter:'blur(12px)',duration:1.2,ease:'expo.out',delay:.15});
    G().from('.glass > *',{y:14,opacity:0,duration:.8,ease:'power3.out',stagger:.06,delay:.35});
    G().from('.gate-ridge',{yPercent:30,opacity:0,duration:1.6,ease:'expo.out'});
    G().from('.gate-hud, .gate-back',{opacity:0,duration:1,delay:.8});
  }
  if(document.readyState==='complete') intro(); else addEventListener('load',intro);

  eye.addEventListener('click',function(){ var on=pw.type==='password'; pw.type=on?'text':'password';
    eye.setAttribute('aria-pressed',on); eye.setAttribute('aria-label',on?'Hide password':'Show password');
    eye.querySelector('use').setAttribute('href',on?'#i-eye-off':'#i-eye'); pw.focus(); });
  pw.addEventListener('input',function(){ field.classList.remove('bad'); err.textContent=''; });

  /* ---- crypto ---- */
  var dec=function(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})};
  function derive(pass){ return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
    .then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(P.s),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}); }
  function open(key){ return crypto.subtle.decrypt({name:'AES-GCM',iv:dec(P.iv)},key,dec(P.ct)).then(function(buf){return {key:key,html:new TextDecoder().decode(buf)}}); }
  function remember(key){ crypto.subtle.exportKey('raw',key).then(function(raw){ try{ sessionStorage.setItem('icc-k',btoa(String.fromCharCode.apply(null,new Uint8Array(raw)))); }catch(e){} }); }
  function reveal(html, fast){
    var host=document.getElementById('case'); host.outerHTML=html;
    function done(){ gate.remove(); document.body.classList.remove('locked'); scrollTo(0,0);
      if(window.initCase) window.initCase(); var h=document.querySelector('main h1'); if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});} }
    if(fast||!G()||reduce){ done(); return; }
    lockIc.style.color='#7EDB5A'; lockIc.style.borderColor='rgba(126,219,90,.6)';
    speed=6;
    var tl=G().timeline({onComplete:done});
    tl.to(lockIc,{rotate:-12,scale:1.12,duration:.35,ease:'power2.out'})
      .to(lockIc,{rotate:0,scale:1,duration:.4,ease:'expo.out'})
      .to(form,{y:-24,scale:1.04,opacity:0,filter:'blur(10px)',duration:.7,ease:'power3.in'},'-=.1')
      .to('#terrain',{scale:1.35,opacity:0,duration:1.1,ease:'expo.in',transformOrigin:'50% 60%'},'<')
      .to('.gate-ridge',{yPercent:60,duration:.9,ease:'expo.in'},'<')
      .to(gate,{opacity:0,duration:.5,ease:'power1.out'},'-=.3');
  }
  function fail(){
    field.classList.add('bad'); err.textContent="That password didn't work. Check it and try again.";
    go.disabled=false; goLabel.textContent='Unlock case study'; pw.select();
    if(G()&&!reduce) G().fromTo(form,{x:0},{keyframes:{x:[-12,10,-8,6,-3,0]},duration:.5,ease:'power1.out'});
  }
  form.addEventListener('submit',function(e){ e.preventDefault();
    if(!pw.value){ err.textContent='Enter the password to continue.'; field.classList.add('bad'); return; }
    go.disabled=true; goLabel.textContent='Checking';
    derive(pw.value).then(open).then(function(r){ remember(r.key); reveal(r.html); }).catch(fail);
  });

  /* ---- already unlocked in this session ---- */
  var saved=null; try{ saved=sessionStorage.getItem('icc-k'); }catch(e){}
  if(saved){ crypto.subtle.importKey('raw',dec(saved),{name:'AES-GCM'},true,['decrypt']).then(open)
    .then(function(r){ reveal(r.html,true); }).catch(function(){ try{sessionStorage.removeItem('icc-k')}catch(e){} pw.focus(); }); }
  else { setTimeout(function(){ pw.focus({preventScroll:true}); },400); }
})();
</script>
