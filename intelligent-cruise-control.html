<style>

@font-face{font-family:"Switzer";src:url(assets/fonts/Switzer-normal.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Cabinet Grotesk";src:url(assets/fonts/CabinetGrotesk-normal.woff2) format("woff2");font-weight:100 900;font-style:normal;font-display:swap}
@font-face{font-family:"Tabular";src:url(assets/fonts/Tabular-normal.woff2) format("woff2");font-weight:300 700;font-style:normal;font-display:swap}

:root{
  --paper:#13140E;--paper-2:#1A1B14;--paper-3:#25261E;--night:#0D0E09;
  --ink:#F4F3E8;--ink-2:#C9C8BB;--ink-3:#A3A296;
  --line:rgba(244,243,232,.16);--line-2:rgba(244,243,232,.09);
  --lime:#EBFC72;--accent:#7EDB5A;--accent-2:#5CC8DC;--warn:#F2A65A;--bad:#F26B5B;
  --accent-soft:rgba(126,219,90,.14);--accent-2-soft:rgba(92,200,220,.14);
  --f-display:"Cabinet Grotesk","Switzer",ui-sans-serif,system-ui,sans-serif;
  --f-sans:"Switzer",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"Tabular",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px;--ease:cubic-bezier(.16,1,.3,1);
  --wrap:min(1180px, calc(100vw - 32px));
}
*{box-sizing:border-box}
html{background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
body{margin:0;font:400 17px/1.6 var(--f-sans);background:var(--paper);overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit}
.wrap{width:var(--wrap);margin-inline:auto}
.icon-sprite{position:absolute;width:0;height:0;overflow:hidden}
.ic{width:24px;height:24px;flex:none;transition:transform .35s var(--ease)}
a:hover .ic,button:hover .ic{transform:translate(1px,-1px)}
h1,h2,h3{font-family:var(--f-display);font-weight:800;letter-spacing:-.01em;line-height:1.05;margin:0}
h2{font-size:clamp(32px,4.6vw,56px);max-width:16ch}
h3{font-size:22px;font-weight:700;line-height:1.2}
p{margin:0 0 1em;max-width:66ch;color:var(--ink-2)}
.mono{font-family:var(--f-mono);font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.lede{font-size:clamp(19px,1.8vw,22px);color:var(--ink);max-width:52ch}
strong{color:var(--ink);font-weight:600}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(19,20,14,.86);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-2)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.top a{text-decoration:none;display:inline-flex;align-items:center;gap:8px;min-height:44px}
.top .name{font-family:var(--f-display);font-weight:800;font-size:20px}
.progress{position:absolute;left:0;bottom:-1px;height:2px;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(0)}

/* hero */
.hero{padding:72px 0 48px}
.hero-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:48px;align-items:center}
.hero h1{font-size:clamp(46px,7.4vw,104px);margin:14px 0 22px}
.meta{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin:32px 0 0;padding:24px 0 0;border-top:1px solid var(--line)}
.meta dt{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin-bottom:4px}
.meta dd{margin:0;color:var(--ink);font-size:15px;line-height:1.45}

/* cluster */
.cluster{position:relative;aspect-ratio:16/10;border-radius:22px;background:radial-gradient(120% 90% at 50% 0%,#20221a 0%,var(--night) 70%);border:1px solid var(--line);overflow:hidden;box-shadow:0 40px 80px -40px rgba(0,0,0,.8)}
.cluster svg.road{position:absolute;inset:0;width:100%;height:100%}
.cl-sign{position:absolute;left:7%;top:12%;width:17%;aspect-ratio:1;border-radius:50%;background:#fff;border:solid #D62E2E;border-width:clamp(5px,1.1vw,10px);display:grid;place-items:center;color:#111;font:800 clamp(18px,3vw,36px)/1 var(--f-display);transition:transform .5s var(--ease)}
.cl-sign.pulse{animation:pulse 1.2s var(--ease)}
@keyframes pulse{0%{transform:scale(1)}30%{transform:scale(1.12)}100%{transform:scale(1)}}
.cl-hint{position:absolute;left:26%;top:16%;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:999px;background:rgba(244,243,232,.08);border:1px solid var(--line);font:500 clamp(10px,1.2vw,13px)/1 var(--f-mono);color:var(--ink);opacity:0;transform:translateX(-8px);transition:opacity .4s var(--ease),transform .4s var(--ease)}
.cl-hint.on{opacity:1;transform:none}
.cl-hint b{color:var(--accent);font-weight:500}
.cl-hint .ring{width:18px;height:18px}
.cl-set{position:absolute;right:7%;top:12%;text-align:right}
.cl-set .lbl{font:500 clamp(10px,1.1vw,12px)/1 var(--f-mono);letter-spacing:.08em;color:var(--ink-3)}
.cl-set .val{display:flex;align-items:center;gap:10px;justify-content:flex-end;font:800 clamp(26px,4.4vw,52px)/1 var(--f-display);color:var(--accent);margin-top:6px}
.cl-set .unit{font:500 clamp(10px,1.1vw,12px)/1 var(--f-mono);color:var(--ink-3)}
.tt{width:clamp(16px,2vw,24px);height:auto;color:#fff;transition:color .5s var(--ease)}
.tt.match{color:var(--accent)}
.cl-speed{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);text-align:center}
.cl-speed .v{font:800 clamp(30px,5.4vw,64px)/1 var(--f-display)}
.cl-speed .u{font:500 12px/1 var(--f-mono);color:var(--ink-3);letter-spacing:.08em}
.cl-pop{position:absolute;left:50%;top:44%;transform:translate(-50%,-40%) scale(.96);width:62%;padding:14px 18px;border-radius:12px;background:#1e2a1a;border:1px solid rgba(126,219,90,.4);text-align:center;opacity:0;pointer-events:none;transition:opacity .35s var(--ease),transform .35s var(--ease)}
.cl-pop.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.cl-pop .t{font:700 clamp(13px,1.6vw,18px)/1.25 var(--f-display)}
.cl-pop .s{font:500 clamp(10px,1.1vw,12px)/1.3 var(--f-mono);color:var(--ink-2);margin-top:6px;letter-spacing:.04em}
.cl-tag{position:absolute;left:14px;bottom:12px;font:500 11px/1 var(--f-mono);letter-spacing:.06em;color:var(--ink-3)}
.controls{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px}
button{font:500 14px/1 var(--f-sans);color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer;transition:background .25s,border-color .25s,color .25s}
button:hover{border-color:var(--ink-3)}
button:focus-visible,a:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.seg button{border:0;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
button.primary{background:var(--accent);color:#0f1a0a;border-color:var(--accent);font-weight:600}
.demo-note{font-size:13px;color:var(--ink-3);margin-top:10px}

/* sections */
section{padding:96px 0;border-top:1px solid var(--line-2)}
.sec-head{display:grid;grid-template-columns:220px 1fr;gap:32px;margin-bottom:40px}
.sec-head .mono{padding-top:10px}
.cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.cols-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.card{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);padding:24px}
.card h3{margin:12px 0 8px}
.card p{font-size:15px;margin:0}
.card .ic{color:var(--accent)}
.k{font:800 clamp(40px,5vw,64px)/1 var(--f-display);color:var(--accent)}
.k small{font-size:.45em;color:var(--ink-2);margin-left:4px}
.pull{font:700 clamp(24px,3vw,36px)/1.2 var(--f-display);color:var(--ink);max-width:28ch;margin:40px 0 0;padding-left:20px;border-left:3px solid var(--accent)}

/* process rail */
.rail{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px;padding-top:28px}
.rail::before{content:"";position:absolute;left:0;right:0;top:9px;height:2px;background:var(--line)}
.rail .fill{position:absolute;left:0;top:9px;height:2px;width:100%;background:var(--accent);transform-origin:0 50%;transform:scaleX(1)}
.step{position:relative}
.step::before{content:"";position:absolute;top:-25px;left:0;width:12px;height:12px;border-radius:50%;background:var(--paper);border:2px solid var(--accent)}
.step .mono{display:block;margin-bottom:6px}
.step h3{font-size:18px}
.step p{font-size:14px;margin:6px 0 0}

/* one-pager */
.onepager{background:#f4f3e8;color:#222;border-radius:4px;padding:28px;font-size:14px;line-height:1.5;transform:rotate(-1.2deg);box-shadow:0 30px 60px -30px rgba(0,0,0,.7);max-width:440px}
.onepager .h{font:800 18px/1.2 var(--f-display);margin-bottom:10px}
.onepager .bar{height:9px;border-radius:2px;background:#d9d7c8;margin:8px 0}
.onepager .gap{border:1px dashed #b14a3a;color:#b14a3a;padding:8px 10px;border-radius:3px;margin-top:14px;font:500 12px/1.4 var(--f-mono)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.chip{font:500 13px/1 var(--f-mono);padding:9px 12px;border:1px solid var(--line);border-radius:999px;color:var(--ink-2)}

/* journey */
.journey{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);padding:24px;overflow-x:auto}
.journey svg{min-width:720px;width:100%;height:auto}
.legend{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--ink-2)}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;margin-right:8px;vertical-align:middle}

/* benchmark */
.bench .card{display:flex;flex-direction:column;gap:10px}
.brand{font:800 26px/1 var(--f-display)}
.verdict{font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;align-self:flex-start}
.v-min{background:rgba(242,107,91,.14);color:var(--bad)}
.v-gra{background:var(--accent-soft);color:var(--accent)}
.mini{height:84px;border-radius:8px;background:var(--night);border:1px solid var(--line-2);position:relative;overflow:hidden}

/* stat bar */
.meter{height:14px;border-radius:999px;background:var(--paper-3);overflow:hidden;margin:14px 0 8px}
.meter span{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--warn),var(--bad));border-radius:999px;transform-origin:0 50%}

/* scenario sim */
.sim{background:var(--paper-2);border:1px solid var(--line-2);border-radius:var(--r);padding:20px}
.sim-road{position:relative;height:150px;border-radius:10px;background:var(--night);overflow:hidden}
.sim-road .lane{position:absolute;left:0;right:0;top:50%;height:2px;background:repeating-linear-gradient(90deg,var(--ink-3) 0 26px,transparent 26px 52px);opacity:.5}
.sim-car{position:absolute;left:14%;top:50%;transform:translateY(-50%);color:var(--ink)}
.sim-car .ic{width:40px;height:40px}
.sim-sign{position:absolute;top:14px;left:110%;width:46px;height:46px;border-radius:50%;background:#fff;border:6px solid #D62E2E;display:grid;place-items:center;font:800 16px/1 var(--f-display);color:#111}
.sim-sign small{position:absolute;top:52px;left:50%;transform:translateX(-50%);white-space:nowrap;font:500 11px/1 var(--f-mono);color:var(--ink-3)}
.sim-out{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:14px}
.sim-out .card{padding:16px}
.sim-out .big{font:800 34px/1 var(--f-display)}
.ok{color:var(--accent)}.no{color:var(--bad)}

/* study */
.variants{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.bias li{margin-bottom:8px;color:var(--ink-2)}
.bias{padding-left:20px;margin:0}

/* placeholders */
.slot{border:1.5px dashed rgba(235,252,114,.45);border-radius:var(--r);padding:28px;color:var(--lime);font:500 13px/1.5 var(--f-mono);display:grid;place-items:center;text-align:center;min-height:180px;background:rgba(235,252,114,.03)}
.todo{color:var(--lime);font-family:var(--f-mono);font-size:.9em;background:rgba(235,252,114,.08);padding:1px 6px;border-radius:3px}

/* regulation */
.reg{display:grid;grid-template-columns:1fr;gap:12px}
.reg-row{display:grid;grid-template-columns:120px 1fr 1fr;gap:20px;padding:18px 0;border-bottom:1px solid var(--line-2);align-items:start}
.reg-row .mono{color:var(--accent-2)}
.reg-row p{margin:0;font-size:15px}

/* lit */
.lit{width:100%;border-collapse:collapse;font-size:15px}
.lit th{text-align:left;font:500 12px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 12px 12px 0;border-bottom:1px solid var(--line)}
.lit td{padding:16px 12px 16px 0;border-bottom:1px solid var(--line-2);vertical-align:top;color:var(--ink-2)}
.lit td:first-child{color:var(--ink);min-width:220px}
.lit a{color:var(--accent-2);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.lit a .ic{width:16px;height:16px}

.next{padding:80px 0 120px}
.next a{display:flex;justify-content:space-between;align-items:center;text-decoration:none;padding:28px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.next a span{font:800 clamp(28px,4vw,48px)/1 var(--f-display)}
footer{padding:32px 0 48px;color:var(--ink-3);font-size:14px}

@media (max-width:900px){
  .hero-grid,.sec-head,.cols,.cols-2,.variants{grid-template-columns:1fr}
  .rail{grid-template-columns:1fr;padding-top:0;padding-left:28px}
  .rail::before{left:5px;right:auto;top:0;bottom:0;width:2px;height:auto}
  .rail .fill{left:5px;top:0;width:2px;height:100%;transform-origin:50% 0}
  .step::before{top:4px;left:-28px}
  .reg-row{grid-template-columns:1fr;gap:6px}
  section{padding:72px 0}
  .lit,.lit tbody,.lit tr,.lit td{display:block}
  .lit thead{display:none}
  .lit tr{border-bottom:1px solid var(--line);padding:12px 0}
  .lit td{border:0;padding:4px 0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- lock screen (glass, V5) ---------- */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
body.locked{overflow:hidden}
body.locked .top{visibility:hidden}
.gate{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(120% 80% at 50% 110%,#1d2014 0%,#0D0E09 55%,#07080500 100%),#0B0C08;overflow:hidden}
.gate-terrain{position:absolute;inset:0;width:100%;height:100%;opacity:.9}
.gate-terrain path{fill:none;stroke:rgba(235,252,114,.16);stroke-width:1}
.gate-terrain path.major{stroke:rgba(235,252,114,.3);stroke-width:1.3}
.gate-lamp{position:absolute;left:0;top:0;width:900px;height:900px;margin:-450px 0 0 -450px;border-radius:50%;pointer-events:none;background:radial-gradient(closest-side,rgba(235,252,114,.13),rgba(126,219,90,.05) 45%,transparent 72%);mix-blend-mode:screen;will-change:transform}
.gate-ridge{position:absolute;left:0;right:0;bottom:0;width:100%;height:28vh;min-height:150px}
.gate-back{position:absolute;top:16px;left:16px;display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 16px 0 12px;border-radius:999px;text-decoration:none;color:var(--ink);font-size:15px;background:rgba(244,243,232,.06);border:1px solid rgba(244,243,232,.12);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);z-index:2}
.gate-back .ic{width:20px;height:20px}
.gate-back:hover .ic{transform:translateX(-2px)}
.gate-hud{position:absolute;bottom:20px;display:flex;flex-direction:column;gap:4px;font:500 12px/1.2 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:rgba(244,243,232,.5);z-index:2}
.gate-hud b{font-weight:500;color:var(--lime)}
.gate-hud--l{left:20px}.gate-hud--r{right:20px;text-align:right}
.glass{position:relative;z-index:3;width:min(440px,100%);padding:36px 32px 28px;border-radius:28px;text-align:center;
  background:linear-gradient(160deg,rgba(244,243,232,.14),rgba(244,243,232,.04) 55%,rgba(244,243,232,.07));
  border:1px solid rgba(244,243,232,.16);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 40px 90px -30px rgba(0,0,0,.8);
  backdrop-filter:blur(28px) saturate(170%);-webkit-backdrop-filter:blur(28px) saturate(170%)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(80% 50% at 50% 0%,rgba(255,255,255,.12),transparent 70%)}
.glass-lock{width:64px;height:64px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;color:var(--lime);background:rgba(235,252,114,.08);border:1px solid rgba(235,252,114,.28);box-shadow:0 0 0 8px rgba(235,252,114,.04)}
.glass-lock .ic{width:28px;height:28px}
.glass-kicker{margin:0 auto 6px;font:500 12px/1 var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--lime)}
.glass-title{font:800 clamp(28px,6vw,36px)/1.05 var(--f-display);margin:0 0 12px}
.glass-text{margin:0 auto 22px;font-size:15px;color:var(--ink-2);max-width:34ch}
.glass-field{position:relative;display:flex;align-items:center;border-radius:14px;background:rgba(13,14,9,.45);border:1px solid rgba(244,243,232,.16);transition:border-color .3s,box-shadow .3s}
.glass-field:focus-within{border-color:rgba(235,252,114,.6);box-shadow:0 0 0 4px rgba(235,252,114,.12)}
.glass-field.bad{border-color:var(--bad);box-shadow:0 0 0 4px rgba(242,107,91,.14)}
.glass-field input{flex:1;min-width:0;height:52px;padding:0 8px 0 18px;border:0;outline:0;background:transparent;color:var(--ink);font:500 17px/1 var(--f-sans);letter-spacing:.02em}
.glass-field input::placeholder{color:rgba(244,243,232,.42)}
.glass-eye{border:0;min-height:44px;width:44px;margin-right:4px;padding:0;display:grid;place-items:center;border-radius:10px;color:var(--ink-2)}
.glass-eye[aria-pressed="true"]{color:var(--lime)}
.glass-eye .ic{width:20px;height:20px}
.glass-err{min-height:20px;margin:10px 0 6px;font-size:14px;color:var(--bad);text-align:left}
.glass-go{width:100%;min-height:52px;display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:14px;border:0;background:var(--lime);color:#14160c;font:600 16px/1 var(--f-sans);box-shadow:0 10px 30px -10px rgba(235,252,114,.5);transition:transform .3s var(--ease),box-shadow .3s}
.glass-go:hover{transform:translateY(-1px);box-shadow:0 14px 34px -10px rgba(235,252,114,.6)}
.glass-go .ic{width:20px;height:20px}
.glass-go[disabled]{opacity:.75;cursor:progress}
.glass-help{margin:16px auto 0;font-size:14px;color:var(--ink-3)}
.glass-help a{color:var(--ink)}
@media (max-width:520px){.glass{padding:28px 20px 22px;border-radius:24px}.gate-hud{display:none}}
</style>

<script>
window.initCase=function(){
  /* ---------- cluster demo ---------- */
  const $=id=>document.getElementById(id);
  const sign=$('sign'),set=$('set'),spd=$('spd'),tt=$('tt'),pop=$('pop'),popT=$('popT'),popS=$('popS'),hint=$('hint'),hintText=$('hintText'),arc=$('ringArc');
  const st={limit:80,set:80,speed:80,mode:'manual',variant:'final',pending:false,prev:80,rejectable:false};
  const rej=document.querySelector('[data-reject]');let rejT=null;
  rej.addEventListener('click',()=>{stopAuto();if(!st.rejectable)return;st.set=st.prev;st.rejectable=false;render();rampSpeed();hideCue();});
  let timer=null,speedAnim=null,cycle=null;
  function render(){
    sign.textContent=st.limit; set.textContent=st.set;
    tt.classList.toggle('match',st.set===st.limit);
  }
  function rampSpeed(){
    clearInterval(speedAnim);
    speedAnim=setInterval(()=>{ if(st.speed===st.set){clearInterval(speedAnim);return}
      st.speed+=st.speed<st.set?1:-1; spd.textContent=st.speed; },40);
  }
  function hideCue(){pop.classList.remove('on');hint.classList.remove('on');st.pending=false;clearTimeout(timer);arc.style.transition='none';arc.style.strokeDashoffset=0;}
  function showCue(kind){
    hideCue();
    const isProposal=kind==='proposal';
    if(st.variant==='popup'){
      popT.textContent=isProposal?'Speed zone detected':'Set speed changed';
      popS.textContent=isProposal?'TO ACCEPT, PRESS RES':'SET TO '+st.set+'. REJECT TO KEEP '+st.prev;
      pop.classList.add('on');
    }else{
      hintText.innerHTML=isProposal?'New limit. Press <b>RES</b>':'Set to <b>'+st.set+'</b>. Reject to keep '+st.prev;
      hint.classList.add('on');
      arc.getBoundingClientRect();
      arc.style.transition='stroke-dashoffset 5s linear';arc.style.strokeDashoffset=50.3;
    }
    st.pending=isProposal;
    timer=setTimeout(hideCue,5000);
  }
  function zone(v){
    if(v===st.limit) v = v===60?50:110;
    st.limit=v; sign.classList.remove('pulse'); void sign.offsetWidth; sign.classList.add('pulse');
    if(st.mode==='auto'){st.prev=st.set;st.set=v;render();rampSpeed();showCue('done');st.rejectable=true;clearTimeout(rejT);rejT=setTimeout(()=>{st.rejectable=false;},5000);}
    else{render();showCue('proposal');}
  }
  function res(){ st.set=st.limit; render(); rampSpeed(); hideCue(); }
  document.querySelectorAll('[data-zone]').forEach(b=>b.addEventListener('click',()=>{stopAuto();zone(+b.dataset.zone)}));
  document.querySelector('[data-res]').addEventListener('click',()=>{stopAuto();res()});
  document.querySelectorAll('[data-mode]').forEach(b=>b.addEventListener('click',()=>{stopAuto();
    st.mode=b.dataset.mode;rej.hidden=st.mode!=='auto';document.querySelectorAll('[data-mode]').forEach(x=>x.setAttribute('aria-pressed',x===b));hideCue();
    $('demoNote').textContent=st.mode==='auto'?'Auto mode: the set speed follows the legal limit. Every change is shown, and you can reject it within five seconds.':'Manual mode: the car proposes the new limit and waits for you. RES always sets your speed to the legal limit, even after the proposal times out.';}));
  document.querySelectorAll('[data-variant]').forEach(b=>b.addEventListener('click',()=>{stopAuto();
    st.variant=b.dataset.variant;document.querySelectorAll('[data-variant]').forEach(x=>x.setAttribute('aria-pressed',x===b));hideCue();}));
  render();
  /* gentle autoplay until the visitor interacts */
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function stopAuto(){clearInterval(cycle);cycle=null}
  if(!reduce){
    const script=[()=>zone(60),()=>res(),()=>zone(100),()=>{}];let i=0;
    setTimeout(()=>{ if(cycle===false) return; cycle=setInterval(()=>{script[i%script.length]();i++},2600); },1200);
  }

  /* ---------- scenario sim ---------- */
  const simSign=$('simSign'),simAuto=$('simAuto'),simMan=$('simMan');
  $('simPlay').addEventListener('click',()=>{
    simAuto.textContent='70';simMan.textContent='70';
    simSign.style.transition='none';simSign.style.left='110%';simSign.getBoundingClientRect();
    simSign.style.transition='left 2.4s linear';simSign.style.left='-20%';
    setTimeout(()=>{simAuto.textContent='55';},1900);
  });

  /* ---------- motion ---------- */
  if(!window.gsap||reduce) return;
  gsap.registerPlugin(ScrollTrigger);
  gsap.to('.progress',{scaleX:1,ease:'none',scrollTrigger:{start:0,end:'max',scrub:.3}});
  gsap.utils.toArray('[data-split]').forEach(el=>{
    gsap.from(el,{yPercent:30,opacity:0,duration:1,ease:'expo.out',scrollTrigger:{trigger:el,start:'top 88%'}});
  });
  gsap.utils.toArray('[data-r]').forEach(el=>{
    gsap.from(el,{y:28,opacity:0,duration:.9,ease:'power3.out',scrollTrigger:{trigger:el,start:'top 90%'}});
  });
  const vertical=matchMedia('(max-width:900px)').matches;
  gsap.from('#rail .fill',{[vertical?'scaleY':'scaleX']:0,ease:'none',scrollTrigger:{trigger:'#rail',start:'top 80%',end:'bottom 55%',scrub:.5}});
  document.querySelectorAll('path.draw').forEach(p=>{
    const L=p.getTotalLength();p.style.strokeDasharray=L;
    gsap.fromTo(p,{strokeDashoffset:L},{strokeDashoffset:0,duration:2,ease:'power2.inOut',scrollTrigger:{trigger:'#journey',start:'top 60%'}});
  });
  gsap.from('.meter span',{scaleX:0,duration:1.6,ease:'expo.out',scrollTrigger:{trigger:'.meter',start:'top 85%'}});
  ScrollTrigger.create({trigger:'#scenario .sim',start:'top 70%',once:true,onEnter:()=>$('simPlay').click()});
};
</script>

  var gate=document.getElementById('gate'), form=document.getElementById('glass'), pw=document.getElementById('pw'),
      err=document.getElementById('err'), field=document.getElementById('field'), go=document.getElementById('go'),
      goLabel=document.getElementById('goLabel'), eye=document.getElementById('eye'), lockIc=document.getElementById('lockIc');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var G=function(){return window.gsap};
  document.body.classList.add('locked');

  /* ---- topographic contours that drift ---- */
  var svg=document.getElementById('terrain'), lines=[], N=26, t0=performance.now();
  function size(){ svg.setAttribute('viewBox','0 0 '+innerWidth+' '+innerHeight); }
  size(); addEventListener('resize',size);
  for(var i=0;i<N;i++){ var p=document.createElementNS('http://www.w3.org/2000/svg','path'); if(i%5===0)p.setAttribute('class','major'); svg.appendChild(p); lines.push(p); }
  var speed=1;
  function draw(now){
    var w=innerWidth,h=innerHeight,t=(now-t0)/1000*speed, seg=48;
    for(var i=0;i<N;i++){
      var base=h*(i+.5)/N, d='';
      for(var k=0;k<=seg;k++){
        var x=w*k/seg, u=k/seg;
        var y=base+Math.sin(u*6.2+i*.55+t*.12)*h*.035+Math.sin(u*13.1-i*.31+t*.07)*h*.014+Math.cos(u*2.3+i*.9)*h*.05*Math.sin(i*.4+t*.05);
        d+=(k?' L':'M')+x.toFixed(1)+' '+y.toFixed(1);
      }
      lines[i].setAttribute('d',d);
    }
    if(!reduce && gate.isConnected) requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---- headlamp follows the pointer, HUD heading follows too ---- */
  var lamp=document.getElementById('lamp'), hdg=document.getElementById('hdg'), elev=document.getElementById('elev');
  var lx=innerWidth/2, ly=innerHeight*.45, tx=lx, ty=ly;
  addEventListener('pointermove',function(e){tx=e.clientX;ty=e.clientY;});
  (function follow(){ lx+=(tx-lx)*.08; ly+=(ty-ly)*.08; lamp.style.transform='translate('+lx+'px,'+ly+'px)';
    hdg.textContent=String(Math.round((tx/innerWidth)*359)).padStart(3,'0');
    elev.textContent=(2200+Math.round((1-ty/innerHeight)*420)).toLocaleString('en-CA');
    if(gate.isConnected) requestAnimationFrame(follow); })();

  /* ---- entrance ---- */
  function intro(){ if(!G()||reduce) return;
    G().from(form,{y:40,opacity:0,scale:.96,filter:'blur(12px)',duration:1.2,ease:'expo.out',delay:.15});
    G().from('.glass > *',{y:14,opacity:0,duration:.8,ease:'power3.out',stagger:.06,delay:.35});
    G().from('.gate-ridge',{yPercent:30,opacity:0,duration:1.6,ease:'expo.out'});
    G().from('.gate-hud, .gate-back',{opacity:0,duration:1,delay:.8});
  }
  if(document.readyState==='complete') intro(); else addEventListener('load',intro);

  eye.addEventListener('click',function(){ var on=pw.type==='password'; pw.type=on?'text':'password';
    eye.setAttribute('aria-pressed',on); eye.setAttribute('aria-label',on?'Hide password':'Show password');
    eye.querySelector('use').setAttribute('href',on?'#i-eye-off':'#i-eye'); pw.focus(); });
  pw.addEventListener('input',function(){ field.classList.remove('bad'); err.textContent=''; });

  /* ---- crypto ---- */
  var dec=function(b){return Uint8Array.from(atob(b),function(c){return c.charCodeAt(0)})};
  function derive(pass){ return crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey'])
    .then(function(base){return crypto.subtle.deriveKey({name:'PBKDF2',salt:dec(P.s),iterations:P.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt'])}); }
  function open(key){ return crypto.subtle.decrypt({name:'AES-GCM',iv:dec(P.iv)},key,dec(P.ct)).then(function(buf){return {key:key,html:new TextDecoder().decode(buf)}}); }
  function remember(key){ crypto.subtle.exportKey('raw',key).then(function(raw){ try{ sessionStorage.setItem('icc-k',btoa(String.fromCharCode.apply(null,new Uint8Array(raw)))); }catch(e){} }); }
  function reveal(html, fast){
    var host=document.getElementById('case'); host.outerHTML=html;
    function done(){ gate.remove(); document.body.classList.remove('locked'); scrollTo(0,0);
      if(window.initCase) window.initCase(); var h=document.querySelector('main h1'); if(h){h.setAttribute('tabindex','-1');h.focus({preventScroll:true});} }
    if(fast||!G()||reduce){ done(); return; }
    lockIc.style.color='#7EDB5A'; lockIc.style.borderColor='rgba(126,219,90,.6)';
    speed=6;
    var tl=G().timeline({onComplete:done});
    tl.to(lockIc,{rotate:-12,scale:1.12,duration:.35,ease:'power2.out'})
      .to(lockIc,{rotate:0,scale:1,duration:.4,ease:'expo.out'})
      .to(form,{y:-24,scale:1.04,opacity:0,filter:'blur(10px)',duration:.7,ease:'power3.in'},'-=.1')
      .to('#terrain',{scale:1.35,opacity:0,duration:1.1,ease:'expo.in',transformOrigin:'50% 60%'},'<')
      .to('.gate-ridge',{yPercent:60,duration:.9,ease:'expo.in'},'<')
      .to(gate,{opacity:0,duration:.5,ease:'power1.out'},'-=.3');
  }
  function fail(){
    field.classList.add('bad'); err.textContent="That password didn't work. Check it and try again.";
    go.disabled=false; goLabel.textContent='Unlock case study'; pw.select();
    if(G()&&!reduce) G().fromTo(form,{x:0},{keyframes:{x:[-12,10,-8,6,-3,0]},duration:.5,ease:'power1.out'});
  }
  form.addEventListener('submit',function(e){ e.preventDefault();
    if(!pw.value){ err.textContent='Enter the password to continue.'; field.classList.add('bad'); return; }
    go.disabled=true; goLabel.textContent='Checking';
    derive(pw.value).then(open).then(function(r){ remember(r.key); reveal(r.html); }).catch(fail);
  });

  /* ---- already unlocked in this session ---- */
  var saved=null; try{ saved=sessionStorage.getItem('icc-k'); }catch(e){}
  if(saved){ crypto.subtle.importKey('raw',dec(saved),{name:'AES-GCM'},true,['decrypt']).then(open)
    .then(function(r){ reveal(r.html,true); }).catch(function(){ try{sessionStorage.removeItem('icc-k')}catch(e){} pw.focus(); }); }
  else { setTimeout(function(){ pw.focus({preventScroll:true}); },400); }
})();
