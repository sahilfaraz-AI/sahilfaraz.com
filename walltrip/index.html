<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>Walltrip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0b0914">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
  /* One column: the room preview, the main action, then the same control panel the headset shows. Single dark look on purpose. */
  :root {
    color-scheme: dark;
    --ink: #0b0914;
    --text: #f4f0fb;
    --muted: #a79fbd;
    --line: #2a2340;
    --accent: #ff4fa3;
    --display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
    --body: "Inter", "Segoe UI", system-ui, sans-serif;
  }
  html, body { background: var(--ink); color: var(--text); }
  body { font-family: var(--body); font-size: 16px; line-height: 1.5; }
  .app {
    max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px;
    padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; }
  .brand { display: flex; flex-direction: column; min-width: 0; }
  h1 { font-family: var(--display); font-weight: 600; font-size: 30px; letter-spacing: -0.01em; margin: 0; }
  #status { margin: 0; color: var(--muted); }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .btn {
    font: 600 17px var(--display); color: var(--text); background: rgba(255,255,255,0.07);
    border: 1px solid var(--line); border-radius: 999px; padding: 0 24px; min-height: 52px;
    display: inline-flex; align-items: center; gap: 10px; cursor: pointer;
  }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .btn:hover:not(:disabled) { filter: brightness(1.12); }
  .btn:focus-visible, .panel:focus-visible { outline: 3px solid #6fe6ff; outline-offset: 3px; }
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 62vh; min-height: 220px; border-radius: 18px; overflow: hidden; background: #050409; border: 1px solid var(--line); }
  .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { display: block; width: 100%; height: auto; max-width: 100%; aspect-ratio: 1800 / 1120; touch-action: none; border-radius: 14px; }
  .note { margin: 0; color: var(--muted); max-width: 70ch; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  @media (prefers-reduced-motion: reduce) { .btn { transition: none; } }
</style>

<main class="app">
  <header>
    <div class="brand">
      <h1>Walltrip</h1>
      <p id="status" role="status">Loading the songs…</p>
    </div>
    <div class="actions">
      <button id="enter" class="btn primary" type="button" disabled>Enter mixed reality</button>
      <label class="btn" for="file">Add your song<input id="file" class="visually-hidden" type="file" accept="audio/*"></label>
    </div>
  </header>
  <p id="xr-note" class="note" hidden>Mixed reality starts in the Meta Quest browser. Here you get a preview of the same visuals; move the pointer over it to look around.</p>
  <div id="stage" class="stage"><canvas id="view" aria-label="Preview of the visuals on the far wall of a room"></canvas></div>
  <div id="panel-host"></div>
  <p class="note">Keyboard: space plays and pauses, the arrow keys change songs, 1 to 8 pick a style, R turns Reverie on and off.</p>
</main>

<script src="app.js?v=202611110409"></script>
</body>
</html>
